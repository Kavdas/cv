/* ================================================================
   RENDER
   ================================================================ */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let lang = "en";

function render() {
  const d = C[lang];
  document.documentElement.lang = lang;

  /* rail badge */
  $("#b-name").textContent = d.brand.name;
  $("#b-kicker").textContent = d.dir;
  $("#b-role").textContent = d.brand.role;
  $("#b-status").textContent = d.brand.status;
  $("#b-meta").innerHTML = d.brand.meta.map(([, v]) => esc(v)).join(" · ");

  /* rail nav */
  $("#railnav").innerHTML = d.nav
    .map(([id, label]) => `<a href="#${id}" data-nav="${id}">${esc(label)}</a>`)
    .join("");

  /* lang buttons */
  document.querySelectorAll("[data-lang]").forEach((b) => {
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  });

  /* main */
  const m = $("#main");
  m.innerHTML = "";
  m.append(
    sectionSummary(d.summary),
    sectionFocus(d.focus),
    sectionExperience(d.experience),
    sectionProjects(d.projects),
    sectionSkills(d.skills),
    sectionEducation(d.education),
    sectionReference(d.reference),
    sectionStrengths(d.strengths),
    sectionContact(d.contact),
  );

  wireObservers();
}

function shell(id, eyebrow, headHTML) {
  const s = el("section", "section reveal");
  s.id = id;
  s.append(el("p", "eyebrow", esc(eyebrow)));
  if (headHTML) s.append(el("div", "section__head", headHTML));
  return s;
}

function sectionSummary(x) {
  const s = el("section", "section reveal hero");
  s.id = "summary";
  s.append(el("p", "eyebrow", esc(x.eyebrow)));
  s.append(el("h1", null, `${esc(x.h1[0])}<span class="accent">${esc(x.h1[1])}</span>${esc(x.h1[2])}`));
  const body = el("div", "hero__body");
  x.body.forEach((p) => body.append(el("p", null, esc(p))));
  s.append(body);
  const tags = el("div", "taglist");
  x.tags.forEach((t) => tags.append(el("span", "chip", esc(t))));
  s.append(tags);
  return s;
}

function sectionFocus(x) {
  const s = shell("focus", x.eyebrow, `<h2>${esc(x.h2)}</h2><p>${esc(x.lead)}</p>`);
  const cols = el("div", "cols");
  x.cols.forEach(([title, items]) => {
    const c = el("div", "card");
    c.append(el("h3", null, esc(title)));
    const ul = el("ul");
    items.forEach((i) => ul.append(el("li", null, esc(i))));
    c.append(ul);
    cols.append(c);
  });
  s.append(cols);
  return s;
}

function sectionExperience(x) {
  const s = shell("experience", x.eyebrow, `<h2>${esc(x.h2)}</h2>`);
  const t = el("div", "timeline");
  x.jobs.forEach((j) => {
    const row = el("div", "job");
    const period = el("div", "job__period", esc(j.period) + (j.now ? `<span class="now">${esc(j.now)}</span>` : ""));
    const main = el("div");
    main.append(el("div", "job__org", esc(j.org)));
    main.append(el("div", "job__role", esc(j.role)));
    main.append(el("div", "job__place", esc(j.place)));
    const ul = el("ul");
    j.bullets.forEach((b) => ul.append(el("li", null, esc(b))));
    main.append(ul);
    row.append(period, main);
    t.append(row);
  });
  s.append(t);
  return s;
}

function sectionProjects(x) {
  const s = shell("projects", x.eyebrow, `<h2>${esc(x.h2)}</h2><p>${esc(x.lead)}</p>`);
  const wrap = el("div", "projects");
  x.items.forEach((p) => {
    const c = el("article", "project");
    c.append(el("div", "project__head",
      `<span class="project__name">${esc(p.name)}</span><span class="project__meta">${esc(p.meta)}</span>`));
    c.append(el("div", "project__tagline", esc(p.tagline)));
    c.append(el("p", "project__summary", esc(p.summary)));
    const ul = el("ul");
    p.points.forEach((pt) => ul.append(el("li", null, esc(pt))));
    c.append(ul);
    const st = el("div", "stack");
    p.stack.forEach((t) => st.append(el("span", null, esc(t))));
    c.append(st);
    if (p.links && p.links.length) {
      const lk = el("div", "project__links");
      p.links.forEach(([label, href]) => {
        const a = el("a", null, esc(label) + " ↗");
        a.href = href; a.target = "_blank"; a.rel = "noopener";
        lk.append(a);
      });
      c.append(lk);
    }
    wrap.append(c);
  });
  s.append(wrap);
  return s;
}

function sectionSkills(x) {
  const s = shell("skills", x.eyebrow, `<h2>${esc(x.h2)}</h2>`);
  const g = el("div", "skills");
  x.groups.forEach(([title, items]) => {

    items.forEach((i) => box.append(el("span", null, esc(i))));

function sectionEducation(x) {

function sectionReference(x) {

  fig.append(el("p", "sub", esc(x.sub)));

function sectionStrengths(x) {
  const s = shell("strengths", x.eyebrow, `<h2>${esc(x.h2)}</h2>`);
  const grid = el("div", "stack-two");
  const ul = el("ul", "strengths");
  x.items.forEach((i) => ul.append(el("li", null, esc(i))));
  const right = el("div");
  right.append(el("h3", null, `<span style="font-family:var(--font-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)">${esc(x.langTitle)}</span>`));
  const langs = el("div", "langs");
  langs.style.marginTop = "0.7rem";
  x.langs.forEach(([l, lv]) => langs.append(el("div", "langrow", `<b>${esc(l)}</b><span>${esc(lv)}</span>`)));
  right.append(langs);
  grid.append(ul, right);
  s.append(grid);
  return s;
}

function sectionContact(x) {
  const s = shell("contact", x.eyebrow, `<h2>${esc(x.h2)}</h2><p>${esc(x.lead)}</p>`);
  const grid = el("div", "contact-grid");
  x.links.forEach(([k, v, href]) => {
    const ext = /^https?:/.test(href);
    const a = el("a", "contact-card");
    a.href = href;
    if (ext) { a.target = "_blank"; a.rel = "noopener"; }
    a.innerHTML = `<span class="k">${esc(k)}</span><span class="v">${esc(v)}</span>`;
    grid.append(a);
  });
  s.append(grid);
  s.append(el("p", "footnote", esc(x.foot)));
  return s;
}

/* ================================================================
   OBSERVERS — reveal on scroll + active nav link
   ================================================================ */
let revealIO, navIO;
function wireObservers() {
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (revealIO) revealIO.disconnect();
  if (reduce) {
    document.querySelectorAll(".reveal").forEach((n) => n.classList.add("in"));
  } else {
    revealIO = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); revealIO.unobserve(e.target); } });
    }, { rootMargin: "0px 0px -8% 0px" });
    document.querySelectorAll(".reveal").forEach((n) => revealIO.observe(n));
  }

  if (navIO) navIO.disconnect();
  const links = new Map([...document.querySelectorAll("[data-nav]")].map((a) => [a.dataset.nav, a]));
  navIO = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        links.forEach((a) => a.classList.remove("active"));
        const a = links.get(e.target.id);
        if (a) a.classList.add("active");
      }
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll("main .section").forEach((s) => navIO.observe(s));
}

document.querySelectorAll("[data-lang]").forEach((b) => {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("cv-lang", lang); } catch (e) {}
    render();
  });
});

const themeToggle = $("#theme-toggle");
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
themeToggle.addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  let next;
  if (!cur) next = sysDark ? "light" : "dark";
  else if (cur === "dark") next = "light";
  else next = "dark";
  applyTheme(next);
  try { localStorage.setItem("cv-theme", next); } catch (e) {}
});

/* ================================================================
   INIT
   ================================================================ */
try {
  const savedLang = localStorage.getItem("cv-lang");
  if (savedLang === "en" || savedLang === "ru") lang = savedLang;
  const savedTheme = localStorage.getItem("cv-theme");
  if (savedTheme) applyTheme(savedTheme);
} catch (e) {}

/* ?lang=ru / ?lang=en and ?theme=light|dark win over saved prefs — lets a shared link open in the right language */
try {
  const qs = new URLSearchParams(location.search);
  const qlang = qs.get("lang");
  if (qlang === "en" || qlang === "ru") lang = qlang;
  const qtheme = qs.get("theme");
  if (qtheme === "light" || qtheme === "dark") applyTheme(qtheme);
} catch (e) {}

render();
